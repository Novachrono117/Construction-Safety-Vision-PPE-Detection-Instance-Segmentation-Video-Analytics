[project]
name = "construction-safety-vision"
version = "0.1.0"
description = "PPE detection, instance segmentation and video analytics for construction safety scenes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vinicius Gomes" }]
keywords = ["computer-vision", "object-detection", "instance-segmentation", "ppe", "construction-safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
dependencies = [
    "pyyaml>=6.0.2",
    # Runtime, not analysis-only: phase 5 derives detection boxes from the
    # canonical segmentation geometry, and 1803 of the 3373 annotations are
    # compressed COCO RLE. pycocotools is the reference implementation of that
    # format; hand-rolling a compressed-RLE decoder for the project's single
    # source of truth would be a correctness risk, not a saving. numpy comes
    # with it and is used for the mask arithmetic.
    "numpy>=2.1",
    "pycocotools>=2.0.8",
    # Installed by phase 6A, the phase that needs them, per the dependency rule
    # in CLAUDE.md. Every phase from 6 onward trains or runs a model, so these
    # are runtime dependencies rather than an optional extra.
    #
    # ultralytics is the reference implementation of the YOLO11 family chosen as
    # the detection baseline; reimplementing its training loop, loss and NMS
    # would be a correctness risk with no benefit to the experiment.
    #
    # The torch floor is 2.7 for a hardware reason, not a preference: this
    # machine's GPU is Blackwell (compute capability 12.0 / sm_120), and 2.7 is
    # the first release whose CUDA 12.8 build carries sm_120 kernels. An older
    # build sees the device and cannot run on it. torch and torchvision are
    # resolved from the CUDA 12.8 index declared below rather than from PyPI,
    # whose default wheel is not guaranteed to be cu128.
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
    # Installed by phase 8C, the phase that needs it. A runtime dependency
    # rather than dev tooling, for the same reason pycocotools is: it computes a
    # number the project reports, so a checkout without it cannot reproduce a
    # committed metric.
    #
    # What it does: `scipy.optimize.linear_sum_assignment` solves the one-to-one
    # ground-truth-to-prediction assignment that maximises total mask IoU, which
    # is the matching rule the direct mask-IoU diagnostic freezes. Only that one
    # function is used, and only from the evaluation path - never from training
    # or inference.
    #
    # Why the existing set is insufficient: nothing installed solves a linear
    # sum assignment. The alternatives were considered and rejected in a
    # recorded methodological review - greedy descending-IoU matching is not the
    # same rule and would change the frozen metric definition, and a hand-rolled
    # Hungarian solver would put a non-trivial algorithm on a reported-metric
    # path, which is precisely the correctness risk cited above for hand-rolling
    # an RLE decoder.
    #
    # Cost: a large binary wheel, no build requirements, BSD-3-Clause, Colab
    # preinstalled, and it constrains only numpy, which is already pinned well
    # inside its supported range.
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    # Analysis tooling: decoding source images and rendering report figures and
    # contact sheets. This project's own analysis code imports them only from
    # scripts under `scripts/`, never from a training or inference path. They
    # are listed here rather than as runtime dependencies for that reason; note
    # that since phase 6A ultralytics pulls both in transitively anyway, so the
    # separation is now about which of *our* modules may import them, not about
    # what ends up installed.
    "pillow>=11.0",
    "matplotlib>=3.9",
]

# torch and torchvision come from the CUDA 12.8 build index. `explicit = true`
# means only the packages mapped to it below are taken from here, so every other
# dependency still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construction_safety_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "RUF",  # ruff-specific
]
ignore = [
    "D107",   # __init__ docstring: covered by the class docstring
    "ANN401", # allow typing.Any where a narrower type is not meaningful
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that are too slow for the default developer loop",
]
