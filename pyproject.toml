[project]
name = "construction-safety-vision"
version = "0.1.0"
description = "PPE detection, instance segmentation and video analytics for construction safety scenes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vinicius Gomes" }]
keywords = ["computer-vision", "object-detection", "instance-segmentation", "ppe", "construction-safety"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Private :: Do Not Upload",
]
dependencies = [
    "pyyaml>=6.0.2",
    # Runtime, not analysis-only: phase 5 derives detection boxes from the
    # canonical segmentation geometry, and 1803 of the 3373 annotations are
    # compressed COCO RLE. pycocotools is the reference implementation of that
    # format; hand-rolling a compressed-RLE decoder for the project's single
    # source of truth would be a correctness risk, not a saving. numpy comes
    # with it and is used for the mask arithmetic.
    "numpy>=2.1",
    "pycocotools>=2.0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    # Analysis-only: decoding source images and rendering report figures and
    # contact sheets. Deliberately NOT runtime dependencies - training and
    # inference must never import them.
    "pillow>=11.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construction_safety_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "RUF",  # ruff-specific
]
ignore = [
    "D107",   # __init__ docstring: covered by the class docstring
    "ANN401", # allow typing.Any where a narrower type is not meaningful
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that are too slow for the default developer loop",
]
