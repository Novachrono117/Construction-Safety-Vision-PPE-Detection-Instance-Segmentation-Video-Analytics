# S0 - segmentation baseline protocol, frozen in phase 8B before any training run.
#
# Loaded by `construction_safety_vision.segmentation_experiment`. Parsing is
# strict: an unknown key raises, a missing hyperparameter raises, a box metric
# in a mask section raises, and any reference to the protected split raises.
#
# This file is written BEFORE the experiment. That is the point: a protocol
# recorded afterwards is not a protocol, it is a description of whatever
# happened. Nothing here was chosen by trying values against validation, and
# no S0 performance number existed when it was frozen.
#
# It is a sibling of `detection_baseline.yaml`, not a child of it. The detection
# protocol is inherited by D0, D1 and D2 and its digest is recorded in three
# committed manifests, so it is not touched by a later phase.

schema_version: 1

experiment_id: S0
task: segmentation

description: >-
  What validation instance-segmentation performance does a pretrained
  YOLO11n-seg model achieve at the same 768-pixel input resolution as the frozen
  detector, using the phase 8A audited segmentation adapter? S0 is a baseline
  reference point, not the project's final segmenter and not an attempt at a
  good score.

# --- architecture ------------------------------------------------------------

# Selected by human review of the phase 8A quantitative fidelity audit, recorded
# in reports/segmentation_adapter_approval.json. The audit measured; it selected
# nothing. Three reasons, none of them a claim of universal superiority:
# the audited adapter parses and preserves instance cardinality for the complete
# development population at quantified fidelity; the family matches the frozen
# detector's YOLO11, so a later operational comparison is between comparable
# things; and 768 px aligns the two models' input resolution.
architecture: YOLO11n-seg
model: YOLO11n-seg
weights: pretrained
weight_identifier: yolo11n-seg.pt

# Recorded so the alternative stays on the record. Nothing about it has been
# implemented, installed, benchmarked or selected, and this protocol makes no
# claim about how it would perform.
fallback_architecture: >-
  mask-native instance segmentation consuming canonical COCO masks and RLE
  directly, for example Mask R-CNN
fallback_status: NOT_SELECTED_FALLBACK

# --- data --------------------------------------------------------------------

# The authoritative annotation format, whatever the training adapter is. If a
# YOLO label and the canonical COCO document ever disagree, the COCO document is
# right and the adapter is broken.
canonical_ground_truth: COCO_INSTANCE_SEGMENTATION

# The phase 8A adapter descriptor. It carries no `test` key, and this protocol
# may not name one either.
dataset_config: data/processed/adapters/yolo_segmentation_audit/dataset.yaml

# The label bytes S0 trains on, named by digest rather than by path. A path can
# point at regenerated bytes without anything noticing; a digest cannot. These
# are the EXACT bytes phase 8A audited - no conversion was re-run, no algorithm
# was changed, and the runner refuses to train if any of them differs.
adapter:
  role: MODEL_SPECIFIC_DERIVED_REPRESENTATION
  format: YOLO_SEGMENTATION
  audit_phase: "8A"
  audit_manifest_sha256: 9b469264727cee27dcd365aa90f0e2e43feb706bb570e7bd5b4680b0ddb24bdc
  labels_train_sha256: 63a8145d976f7a4c9d1e2868b052c0e0d4233a15f7c6e6b3a1a0e25be6b4cd17
  labels_validation_sha256: dae69290936641d73e576682631ef73e026bf7f33cec8c2a60a7789ac054e83f
  labels_development_sha256: ff21c7822921601a5c2ac6d0d324eb9f234f1a13ce16647f834936de5d5682f2
  image_membership_sha256: 616701e18deb1e6d873459c94e702d33752f1d712fe0f6eebb0fa8288f126d41
  instances: 1726
  train_instances: 1422
  validation_instances: 304
  train_images: 303
  validation_images: 65
  negative_images: 12
  # Every development instance is retained. Excluding the 47 instances whose
  # adapter round-trip IoU fell below 0.90, or the tiny, multi-component,
  # holed or synthetic-rectangle masks, would change the canonical modelling
  # population in response to a model-format limitation - which is choosing the
  # data to suit the tool.
  all_instances_retained: true
  fidelity_based_filtering: NONE

# The frozen canonical class map and the frozen split, by digest. The provider's
# placeholder category `object` carries no annotations and stays absent without
# shifting any index.
class_map_sha256: 596dab5b5756e3d4253924f84bf46d37a87d80b6ec830da781a08a93cd823753
split_assignment_sha256: a230869ff4cb45f53654d67357a27f2a0def6d8ba79f9fa4880f0fdda2f046cc

splits:
  - train
  - validation

# --- execution ---------------------------------------------------------------

# The project's single global seed, as used by every earlier stochastic step.
seed: 42

# The full run requires a CUDA GPU. Recorded as a requirement rather than a
# preference: a CPU run would not be the same experiment, and silently falling
# back to one would make the result incomparable.
device_requirement: CUDA_GPU_REQUIRED

training:
  # Same budget as the detection experiments, so the two tasks are trained for
  # the same number of passes over the same 303 images. Not tuned.
  epochs: 100

  # Aligned with the frozen detector (D2, YOLO11n at 768) so that a later
  # detector-versus-segmenter comparison is not also a resolution comparison.
  # This is a model-input decision, not a canonical-data resize: Ultralytics
  # letterboxes at load time and the source images on disk are untouched.
  imgsz: 768

  # A PREDECLARED EXECUTION DECISION, frozen before any S0 number exists.
  # See `batch_decision` below. It is not searched over and not raised to 16
  # "just to see".
  batch: 8

  # Ultralytics' own default policy: it selects SGD or AdamW and an initial
  # learning rate from the dataset and epoch count. Named explicitly so the
  # resolved values can be captured from the framework log and reported rather
  # than left implicit - and so nobody quotes lr0 0.01 as what the run used.
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false

  # Early stopping. Part of the protocol, so stopping is a rule rather than a
  # judgement made while watching curves. Same value as the detection protocol.
  patience: 50

  # The installed framework version's own defaults, enumerated under
  # `augmentation_arguments` and verified against the installed configuration at
  # freeze time. These are MODEL TRAINING transformations, not canonical
  # preprocessing, and they are not applied to validation. Not tuned.
  augmentation: ULTRALYTICS_DEFAULT_SEGMENTATION_TRAINING_POLICY
  close_mosaic: 10

  amp: true
  deterministic: true
  workers: 8
  pretrained: true
  val: true

# Segmentation-specific framework arguments, read from the installed
# ultralytics 8.4.138 effective configuration rather than from online
# documentation, and verified against it at freeze time. They are recorded
# because two of them change what the model is asked to learn:
#
#   overlap_mask  overlapping instance masks are rasterised into one indexed
#                 map rather than one plane each, so an occluded instance's
#                 target is what remains visible after the overlap is resolved.
#   mask_ratio    the mask target is downsampled by this factor before the loss
#                 sees it, so fine boundary detail is not what is optimised.
#
# None of them is tuned in this phase. The remainder are enumerated so a reader
# can tell they were left alone rather than forgotten.
segmentation_arguments:
  overlap_mask: true
  mask_ratio: 4
  retina_masks: false
  dropout: 0.0
  max_det: 300
  single_cls: false
  rect: false
  multi_scale: 0.0

augmentation_policy: ULTRALYTICS_DEFAULT_SEGMENTATION_TRAINING_POLICY

augmentation_arguments:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  auto_augment: randaugment
  erasing: 0.4

batch_decision: >-
  PREDECLARED_EXECUTION_DECISION. Batch 8 rather than the detection phases' 16,
  fixed before any S0 performance number existed. The segmentation head carries
  an additional mask branch and the trainer materialises per-image mask targets,
  so the memory profile is not the detector's, and this machine has roughly
  8 GiB of VRAM. No scientific question in this project depends on the
  segmentation batch matching the detection batch: S0 is compared against future
  segmentation experiments under this same protocol, never against a detector's
  training configuration. A genuine CUDA out-of-memory event at batch 8 stops
  the experiment as MEMORY_CONSTRAINT_REVIEW_REQUIRED and is never rescued by a
  smaller batch, auto-batch, gradient accumulation, a different imgsz or a
  different model.

# Fixed before training so no checkpoint is chosen after the fact by comparing
# several and keeping the flattering one.
checkpoint_selection: >-
  ULTRALYTICS_BEST_ON_VALIDATION_FITNESS - the `best.pt` Ultralytics writes
  according to its own predeclared validation fitness, computed on the frozen
  validation split only. For a segmentation model that fitness is
  SegmentMetrics.fitness, which is the unweighted SUM of mask mAP@0.50:0.95 and
  box mAP@0.50:0.95: the framework's checkpoint is therefore NOT selected on the
  mask metric alone. That behaviour is recorded here because it was established
  from the installed source before training, not discovered afterwards; it is
  not replaced by a private rule, and any change to it would need methodological
  review. No other checkpoint is inspected, compared or reported, and the
  holdout takes no part in the selection.

# --- the reviewed checkpoint-selection decision --------------------------------
#
# Discovered by inspecting the installed framework BEFORE S0 ran, returned for
# methodological review, and accepted. Recorded as its own block because the
# mechanism that picks the checkpoint and the metric the project reports are two
# different things here, and a reader must not have to reconstruct that.

checkpoint_selection_policy: ULTRALYTICS_NATIVE_SEGMENTATION_FITNESS
checkpoint_selection_review_status: HUMAN_REVIEWED_AND_ACCEPTED_BEFORE_S0
checkpoint_selection_semantics: BOX_MAP50_95_PLUS_MASK_MAP50_95
checkpoint_selection_box_component_weight: 1.0
checkpoint_selection_mask_component_weight: 1.0

# The project's headline segmentation metric. Unchanged by the decision above.
primary_scientific_reporting_metric: MASK_MAP50_95

# Deliberately false, and stated rather than left to be inferred: `best.pt` is
# chosen on a box-plus-mask composite while the reported result is the mask
# metric alone, so the selected epoch need not be the epoch that maximised the
# reported metric.
selection_metric_equals_primary_reporting_metric: false

checkpoint_selection_rationale:
  - >-
    The behaviour was established from the installed source before any full S0
    result existed, so accepting it is a protocol decision rather than a
    rationalisation of whichever checkpoint happened to score well.
  - >-
    It is the native, deterministic behaviour of the frozen Ultralytics
    version. Keeping it means S0 introduces no custom checkpoint-selection
    mechanism whose own behaviour would then need validating.
  - >-
    Instance segmentation requires both instance localisation and mask
    prediction, so a checkpoint chosen on both terms is a defensible baseline -
    which is a reason it is acceptable, not evidence that it is better.
  - >-
    This is NOT a claim that the composite fitness is scientifically superior to
    mask-only selection. Nothing in this project compares the two, and no
    experiment here could support such a claim.
  - >-
    S0 may never be retrospectively re-read as an epoch selected only by mask
    mAP@0.50:0.95. The checkpoint S0 reports is the one the native fitness
    chose, and changing that after the fact would silently replace the
    experiment with a different one.

checkpoint_selection_future_constraint: >-
  PROTOCOL_INVARIANT. Every future segmentation experiment compared directly
  with S0 must select its checkpoint by
  ULTRALYTICS_NATIVE_SEGMENTATION_FITNESS, unless a new comparison protocol is
  human-reviewed and frozen BEFORE any affected experiment is run. A comparison
  in which one model's checkpoint was chosen on a composite and another's on the
  mask metric alone would be measuring the selection rule as well as the model.
  S0's checkpoint semantics are never altered retroactively to satisfy a later
  protocol; a new rule applies to the experiments frozen under it.

# The metric hierarchy is declared here, before the experiment, so the headline
# number cannot be chosen once the results are visible. Mask and box families
# are kept apart: a segmentation model reports both, and merging them is how a
# weak mask result hides behind a strong box one.
metrics:
  primary: mask_mAP@0.50:0.95
  secondary_mask:
    - mask_mAP@0.50
    - mask_precision
    - mask_recall
  box_from_segmenter:
    - box_mAP@0.50:0.95
    - box_mAP@0.50
    - box_precision
    - box_recall
  per_class_mask:
    - mask_AP@0.50
    - mask_AP@0.50:0.95
  per_class_box:
    - box_AP@0.50
    - box_AP@0.50:0.95
  # The unweighted mean mask AP@0.50:0.95 over the classes the frozen phase 7
  # support rule admits. S0 computes and reports it. It is NOT a
  # winner-selection metric yet: there is nothing to select between, and the
  # comparison protocol that would use it does not exist.
  supported_macro: supported_macro_mask_map50_95
  # A composite box-plus-mask score is refused outright rather than left
  # available for a later phase to reach for.
  composite_box_mask_score: false
  artifacts:
    - mask_precision_recall_curve
    - box_precision_recall_curve
    - confusion_matrix
    - training_loss_curves
    - validation_loss_curves

# The rare class, and the limitation attached to it before any number exists.
# The support rule is the one phase 7 froze and is not restated with friendlier
# thresholds: COMPARISON_SUPPORTED requires both >= 5 positive validation source
# images and >= 20 validation instances.
rare_class: vest_loose
rare_class_limitation: >-
  vest_loose occupies 1 validation source image carrying 8 instances under the
  frozen split, so it is classified DESCRIPTIVE_HIGH_UNCERTAINTY by the frozen
  support rule and its validation AP is not a usable selection signal.
  Therefore: do not tune hyperparameters against vest_loose; do not prefer or
  reject a model because vest_loose moved; do not rank it against the supported
  classes. It remains a required class and is reported in full - mask and box,
  AP@0.50 and AP@0.50:0.95, precision and recall - always with an explicit
  small-sample caveat. The holdout also cannot be consulted to resolve the
  uncertainty.

test_policy: PROTECTED_NOT_ACCESSED
