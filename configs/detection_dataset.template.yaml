# Ultralytics dataset descriptor for the canonical YOLO detection adapter.
# Generated by scripts/build_detection_adapter.py - do not hand-edit.
#
# There is deliberately no `test` key. The project's holdout is protected,
# and a dataset file is exactly the kind of place it could be reached by
# accident.
#
# `path` is resolved at generation time because Ultralytics resolves a
# relative path against the working directory, not against this file. The
# committed portable template carries {{ADAPTER_ROOT}} instead.
#
# Class indices are the frozen canonical class map and must not be reordered.
path: {{ADAPTER_ROOT}}
train: images/train
val: images/val

names:
  0: helmet_loose
  1: helmet_on_head
  2: person
  3: vest_loose
  4: vest_on_body
