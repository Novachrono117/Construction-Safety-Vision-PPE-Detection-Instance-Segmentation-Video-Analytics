# Project-level experiment configuration.
#
# Loaded by `construction_safety_vision.config.load_experiment_config`.
# Parsing is strict: unknown keys raise a ConfigError.
#
# STATUS: phase 3 complete. The `dataset` block below was verified against the
# acquired export; see reports/dataset_provenance.md for the evidence.

project_name: construction-safety-vision

# Single global seed for every stochastic step (splitting, augmentation,
# training). Recorded in every provenance record.
seed: 42

# Split protected from any development use until the final one-shot evaluation.
holdout_split: test

# Target proportions. The audit phase decides whether the dataset's own splits
# are adopted or the data is re-split; the frozen result must match these
# numbers (or this file must be updated and the change justified in the report).
split_ratios:
  train: 0.70
  val: 0.15
  test: 0.15

dataset:
  name: Construction PPE Compliance Detection
  source: roboflow_universe
  # Provider coordinates used by scripts/download_dataset.py. Verified against
  # the Roboflow REST API in phase 3.
  workspace: agis-workspace-8gs52
  project_slug: construction-ppe-compliance-detection
  version: 4
  # COCO instance segmentation is the canonical acquisition format: it preserves
  # polygon geometry independently of any detector/segmenter implementation.
  export_format: coco-segmentation
  source_url: "https://universe.roboflow.com/agis-workspace-8gs52/construction-ppe-compliance-detection/dataset/4"
  # Instance segmentation is the canonical source of truth. Detection boxes are
  # derived mathematically from the polygons, so both tasks share images and IDs.
  canonical_task: instance_segmentation
  # Verified in phase 3: all five appear as COCO categories and all five carry
  # annotations. The export also declares a placeholder category 'object' with
  # zero annotations, which phase 5 must exclude from the class map.
  expected_classes:
    - person
    - helmet_loose
    - helmet_on_head
    - vest_loose
    - vest_on_body
  # Set true by the phase 3 acquisition: provenance, license, segmentation
  # annotations, class list and artifact integrity were all verified against the
  # downloaded export. This is NOT a statement about annotation quality, class
  # balance, duplicates or split suitability - those are phase 4 questions.
  verified: true
  notes: >-
    Verified in phase 3 against the downloaded COCO instance-segmentation export
    (see reports/dataset_provenance.md). IMPORTANT: version 4 contains 742
    images, but only 436 are independent source images; the train split is
    augmented x2 offline. Phases 4 and 5 must treat 436 as the independent
    population. Open items: vest_loose has zero annotations in the test split,
    28 image records carry no annotations, and segmentation geometry is a mix of
    polygon and RLE.
