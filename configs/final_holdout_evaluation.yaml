# Final one-shot holdout evaluation protocol - frozen in phase 11A, BEFORE the
# holdout is read for the first and only time.
#
# Loaded by `construction_safety_vision.final_holdout_evaluation`. Parsing is
# strict: an unknown key raises, a wrong checkpoint digest raises, a changed
# confidence, NMS IoU, max_det, imgsz or precision raises, TTA raises, a
# non-deterministic qualitative rule raises, a composite score raises, a
# declared winner raises, an automatic environment unlock raises, any test
# metric present in this file raises, and any test image identifier present in
# this file raises.
#
# TIMING. This protocol is frozen in phase 11A, before any holdout access of any
# kind. Both models were frozen long before - the detector in phase 7D, the
# segmenter in phase 8G - and the whole validation comparison (10A-10D) is
# already published. Nothing here could have been chosen to flatter either
# model, because no holdout number exists and none can exist until phase 11B
# runs under this file.
#
# WHAT THIS IS. A complete, advance declaration of what will be measured on the
# holdout, at which settings, by which evaluator, how failures are handled, and
# what may never be done afterwards. It is written so that the answer to "why
# this threshold / this rule / these examples?" is always "because it was
# frozen before anyone could see the result".
#
# WHAT THIS IS NOT. It is not an evaluation. It contains no test identifier, no
# test annotation, no test prediction and no test metric, and it activates
# neither of the two authorisation gates.

schema_version: 1

protocol: FINAL_HOLDOUT_ONE_SHOT_EVALUATION

status: FROZEN_NOT_EXECUTED

phase: 11A

executes_in_phase: 11B

objective: >-
  Measure, exactly once, how the two frozen models generalise to data that took
  no part in any design, selection, tuning or diagnostic decision, and report
  that measurement with the same evidential discipline every earlier phase used.

# --- the one-shot principle ------------------------------------------------------
#
# The holdout is the project's only remaining unbiased estimate. Every read of it
# spends some of that, and a second read spends the rest, because the second is
# necessarily informed by the first.

one_shot:
  policy: ONE_SHOT_FINAL_HOLDOUT_EVALUATION
  reads_permitted: 1

  the_test_split_is_not:
    - development data
    - model-selection data
    - architecture-selection data
    - hyperparameter-tuning data
    - threshold-tuning data
    - augmentation-tuning data
    - error-driven retraining data
    - data for choosing which qualitative examples look best

  # Everything below becomes forbidden the moment phase 11B begins, not the
  # moment it finishes. Seeing a partial result is still seeing a result.
  prohibited_after_execution_begins:
    - model selection of any kind
    - architecture change
    - threshold tuning
    - hyperparameter tuning
    - retraining or fine-tuning either model
    - dataset cleaning motivated by a test outcome
    - annotation correction motivated by a test outcome
    - any post-test experiment intended to improve a reported test number
    - re-running the evaluation to obtain a different number
    - reporting the better of two holdout runs

  rationale: >-
    A number that can be revised after it is seen is not a generalisation
    estimate; it is a selection metric with extra steps. The prohibitions above
    are what make the reported figure mean what it says.

# --- the two frozen models ---------------------------------------------------------
#
# Both are resolved by digest through their existing freeze accessors, never by
# path. D2 and S1 are the same number of bytes as their rejected siblings in one
# case and a different architecture in the other; only the digest separates them
# reliably.

detector:
  experiment: D2
  role: FINAL_OBJECT_DETECTOR
  model: YOLO11n
  imgsz: 768
  checkpoint_sha256: 0466f872a9de22898c70d8834cf1fcfb3d77f6c9fb27e81ee6248d3d19cbc206
  checkpoint_bytes: 5502289
  identity_fingerprint: 84d30d64a1e7ebfc4e4763643ef3a3b5c8a5ce3cedc74bbefdb8031d48235a6e
  manifest: reports/final_detector_manifest.json
  accessor: construction_safety_vision.detection_freeze
  frozen_in_phase: 7D
  outputs:
    - class
    - confidence
    - bounding_box

segmenter:
  experiment: S1
  role: FINAL_INSTANCE_SEGMENTER
  model: YOLO11n-seg
  imgsz: 768
  mask_ratio: 4
  overlap_mask: false
  checkpoint_sha256: 29337d671459d0f742fb713613cc41d0eafcb8a21f5846ac0da65b2ffc024f20
  checkpoint_bytes: 6041685
  final_segmenter_sha256: 63ef41961ba3fedfef46658754940fb6ce075cdd93087b926d7c6620402579a7
  identity_fingerprint: 63ef41961ba3fedfef46658754940fb6ce075cdd93087b926d7c6620402579a7
  manifest: reports/final_segmenter_manifest.json
  accessor: construction_safety_vision.segmentation_freeze
  frozen_in_phase: 8G
  outputs:
    - class
    - confidence
    - bounding_box
    - instance_mask

# No alternative checkpoint may be substituted in phase 11B - not `last.pt`, not
# D0, D1, S0, and not a retrained copy carrying the same experiment name.
alternate_checkpoint_permitted: false
retraining_to_replace_a_missing_binary_permitted: false

# --- authorisation -----------------------------------------------------------------
#
# The existing dual gate is preserved exactly. Neither opt-in alone unlocks
# anything: a stray environment variable cannot unlock a development script, and
# a stray in-code flag cannot unlock a shell session.

authorization:
  policy: DUAL_INDEPENDENT_OPT_IN
  code_opt_in: allow_test=true
  environment_opt_in: CSVISION_ALLOW_TEST_SPLIT=1
  either_alone_is_refused: true
  guard: construction_safety_vision.splits.assert_split_allowed
  frozen_accessor: construction_safety_vision.data.split_freeze.FrozenSplits

  # Phase 11A activates neither. It must complete with the holdout untouched.
  activated_in_this_phase: false

  # No script in this repository may create, set, export or modify the
  # environment variable. The runner may read it and refuse; it may never
  # satisfy its own precondition.
  automatic_environment_unlock_permitted: false
  runner_may_read_environment: true
  runner_may_write_environment: false

  # Access is granted to the final evaluation runner alone. A generic
  # development script that happens to pass both gates is still refused,
  # because the accessor checks the declared purpose.
  restricted_to_runner: scripts/evaluate_final_holdout.py
  generic_development_access_permitted: false

  records_access_in_ledger: true

# --- the population --------------------------------------------------------------
#
# Aggregate facts only. These were frozen in phase 5C.2, long before any model
# existed, and are quoted from the committed manifest's aggregate count fields.
# No per-image composition is read in phase 11A.

test_population:
  source: reports/split_manifest.json
  source_field: actual_image_counts.test / actual_annotation_counts.test
  split_assignment_sha256: a230869ff4cb45f53654d67357a27f2a0def6d8ba79f9fa4880f0fdda2f046cc
  holdout_sha256: bb7ed43b20a84644d5a3917c6d0ead688132f82a30052b06ae7ad121e4851a00
  modeling_population_sha256_reference: reports/canonical_modeling_manifest.json
  class_map_sha256: 596dab5b5756e3d4253924f84bf46d37a87d80b6ec830da781a08a93cd823753

  # Pre-holdout aggregate facts, frozen before model development.
  images: 65
  annotations: 305
  groups: 65
  negative_images: 2

  per_image_composition_inspected_in_phase_11a: false

  # Phase 11B evaluates the whole frozen holdout.
  evaluate: ALL_FROZEN_TEST_IMAGES
  exclusions_permitted: false
  sampling_permitted: false
  manual_removal_permitted: false
  stratification_permitted: false

  # The single exception, and it is a technical one declared in advance: a file
  # that cannot be decoded at all is not evaluable. It is reported as a named
  # integrity failure with its count, never dropped quietly, and it stops the
  # phase for human review rather than shrinking the population silently.
  technical_validation:
    performed_before_model_execution: true
    criterion: FILE_UNREADABLE_OR_UNDECODABLE_OR_ANNOTATION_DOCUMENT_MALFORMED
    on_failure: TEST_DATA_INTEGRITY_FAILURE
    silent_removal_permitted: false
    reported_as_count_and_identifier_in_ledger: true

# --- classes ----------------------------------------------------------------------

classes:
  - helmet_loose
  - helmet_on_head
  - person
  - vest_loose
  - vest_on_body

class_collapsing_permitted: false
class_map_source: reports/task_dataset_manifest.json

rare_class: vest_loose
rare_class_status: DESCRIPTIVE_HIGH_UNCERTAINTY

# The support rule is the project's pre-existing phase 7A rule, reused
# unchanged. It names no class; the admitted set is its output. It may be
# applied to the holdout's own support only AFTER the evaluation, and it may not
# be re-parameterised in response to what the holdout turns out to contain.
support_rule:
  origin: PREEXISTING_PHASE_7A_SUPPORT_RULE_REUSED_UNCHANGED
  min_positive_images: 5
  min_instances: 20
  supported_label: COMPARISON_SUPPORTED
  unsupported_label: DESCRIPTIVE_HIGH_UNCERTAINTY
  invented_after_seeing_test_results: false
  thresholds_may_change_after_test: false
  role_on_test: DESCRIPTIVE_CAVEAT_ONLY_NEVER_A_SELECTION_RULE

# --- detector inference -------------------------------------------------------------
#
# Identical to the frozen canonical AP path used in phase 10B. conf 0.001 is
# deliberately NOT an operating point: average precision integrates over the
# score curve and needs the low-scoring tail.

detector_inference:
  imgsz: 768
  conf: 0.001
  iou: 0.70
  max_det: 300
  augment: false
  tta: false
  agnostic_nms: false
  precision: FP32
  quantize: 32
  half: false
  classes: ALL_FIVE_FROZEN_CLASSES
  purpose: AP_CURVE
  threshold_sweep_permitted: false
  confidence_tuning_on_test_permitted: false
  mirrors: PHASE_10B_CANONICAL_BOX_COMPARISON_INFERENCE

# --- segmenter inference -------------------------------------------------------------
#
# Identical to the frozen canonical mask-AP path from phase 8E. retina_masks
# puts the predicted masks on the original canvas, which is where the canonical
# ground-truth masks live; resizing either side would make every IoU partly a
# measurement of the resize.

segmenter_inference:
  imgsz: 768
  conf: 0.001
  iou: 0.70
  max_det: 300
  augment: false
  tta: false
  agnostic_nms: false
  precision: FP32
  quantize: 32
  half: false
  retina_masks: true
  mask_reconstruction: ORIGINAL_CANVAS_VIA_OPS_PROCESS_MASK_NATIVE
  classes: ALL_FIVE_FROZEN_CLASSES
  purpose: AP_CURVE
  threshold_sweep_permitted: false
  confidence_tuning_on_test_permitted: false
  mask_reconstruction_change_permitted: false
  mirrors: PHASE_8E_CANONICAL_MASK_AP_EVALUATION_INFERENCE

# --- the canonical bounding-box evaluator ----------------------------------------------
#
# One external evaluator judges both models' boxes, because they run through
# different framework validation paths and their native box numbers are not
# guaranteed to be computed identically.

canonical_bbox_evaluator:
  implementation: pycocotools.cocoeval.COCOeval
  iou_type: bbox
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  max_dets: [1, 10, 100]
  area_range: all
  ground_truth_source: CANONICAL_COCO_DETECTION_BOXES
  ground_truth_document: data/processed/canonical/annotations/detection_test.coco.json
  category_id_mapping: NONE_CANONICAL_IDS_USED_DIRECTLY
  boxes_from_masks: false
  boxes_source: EACH_MODELS_OWN_PREDICTED_BOXES
  mirrors: PHASE_10A_RECOGNITION_EVALUATOR

# --- the canonical segmentation evaluator ------------------------------------------------

canonical_segm_evaluator:
  implementation: pycocotools.cocoeval.COCOeval
  iou_type: segm
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  max_dets: [1, 10, 100]
  area_range: all
  ground_truth_source: CANONICAL_COCO_INSTANCE_SEGMENTATION
  ground_truth_document: data/processed/canonical/annotations/segmentation_test.coco.json
  mask_encoding: PYCOCOTOOLS_BINARY_MASK_RLE
  category_id_mapping: NONE_CANONICAL_IDS_USED_DIRECTLY
  mirrors: PHASE_8E_CANONICAL_EVALUATOR
  source_protocol_fingerprint: 282eb0ec125c47687340325266a2ea397bc0f85e239290a26a5c1ec8d8721e64

# --- what will be reported -------------------------------------------------------------

detector_metrics:
  primary:
    - CANONICAL_TEST_BOX_MAP50_95
    - CANONICAL_TEST_BOX_MAP50
  secondary:
    - CANONICAL_TEST_BOX_PRECISION
    - CANONICAL_TEST_BOX_RECALL
  per_class:
    - AP@0.50:0.95
    - AP@0.50
    - precision
    - recall

segmenter_metrics:
  primary:
    - CANONICAL_TEST_MASK_MAP50_95
    - CANONICAL_TEST_MASK_MAP50
  secondary:
    - CANONICAL_TEST_MASK_PRECISION
    - CANONICAL_TEST_MASK_RECALL
  per_class:
    - AP@0.50:0.95
    - AP@0.50
    - precision
    - recall

  # The segmenter's own boxes, through the SAME bbox evaluator the detector
  # uses, so the final localisation comparison is one evaluator over one ground
  # truth. Never re-derived from its masks.
  box_metrics:
    - S1_CANONICAL_TEST_BOX_MAP50_95
    - S1_CANONICAL_TEST_BOX_MAP50
  box_metrics_evaluator: canonical_bbox_evaluator
  box_metrics_derived_from_masks: false

# --- precision and recall semantics ------------------------------------------------------
#
# Stated explicitly because "precision" and "recall" are not one thing. Two
# different quantities carry those names in this project and they are never
# mixed or differenced.

precision_recall_semantics:
  canonical:
    definition: >-
      Computed from the canonical COCOeval accumulation at the frozen operating
      point declared below, one-to-one class-aware matching, over the same
      predictions the AP figures are computed from.
    iou_threshold_for_counting: 0.50
    operating_confidence: 0.25
    operating_confidence_origin: PROJECT_FROZEN_OPERATIONAL_THRESHOLD_UNCHANGED
    label: CANONICAL_TEST_PRECISION_RECALL_AT_FROZEN_OPERATING_POINT
    is_threshold_independent: false
    tuned_on_test: false
    note: >-
      Precision and recall depend on an operating point. The one used here is the
      project's existing operational 0.25, frozen since phase 10A and not chosen
      with any holdout number in view. It is NOT the AP confidence of 0.001,
      which exists only to preserve the low-scoring tail the AP integral needs.

  native_framework:
    status: REPORTED_SEPARATELY_NEVER_MERGED_WITH_CANONICAL
    caveat: F1_MAXIMISING_OPERATING_POINT_NOT_A_FIXED_CONFIDENCE
    note: >-
      Ultralytics reports one precision/recall pair at the F1-maximising point
      rather than at a fixed confidence, so it is not comparable with the
      canonical pair above and the two are never differenced.

# --- the direct instance-mask IoU diagnostic ----------------------------------------------
#
# The exact phase 8C protocol, reused unchanged. No new direct-IoU rule is
# invented for the holdout, because inventing one now would let the matching
# rule be chosen with the final result in view.

direct_iou:
  protocol: DIRECT_INSTANCE_MASK_IOU_DIAGNOSTIC
  protocol_config: configs/segmentation_mask_iou_evaluation.yaml
  protocol_fingerprint: b912039ca77b36959f74fcdbaed109dbf5e3bd707709556f95a19085c7f34d80
  unchanged_from_phase_8c: true
  new_rule_invented: false

  role: SECONDARY_CANONICAL_DIAGNOSTIC
  is_primary_segmenter_metric: false
  is_an_average_precision: false

  ground_truth_source: CANONICAL_COCO_INSTANCE_SEGMENTATION
  inference:
    imgsz: 768
    conf: 0.25
    iou: 0.70
    max_det: 300
    retina_masks: true
    augment: false
    agnostic_nms: false
    half: false
  inference_note: >-
    This diagnostic keeps its own OPERATIONAL confidence of 0.25, exactly as in
    phase 8C. The canonical AP protocols keep 0.001. The two are never mixed,
    averaged or swapped, and a figure produced at one may never be reported
    under the other's name.

  matching:
    algorithm: SCIPY_LINEAR_SUM_ASSIGNMENT_MAXIMIZE_MASK_IOU
    scope: PER_IMAGE_PER_CLASS_ONE_TO_ONE
    objective: MAXIMIZE_TOTAL_MASK_IOU
    zero_overlap_policy: ASSIGNED_PAIRS_WITH_ZERO_IOU_ARE_NOT_MATCHES
    unmatched_gt_policy: CONTRIBUTES_ZERO_TO_GT_NORMALIZED_MASK_IOU
    deterministic: true

  headline:
    - matched_mask_iou_mean
    - gt_normalized_mask_iou
    - gt_match_coverage
    - gt_iou50_coverage
    - gt_iou75_coverage

  coverage_thresholds: [0.50, 0.75]

  per_class:
    - gt_count
    - prediction_count
    - matched_count
    - matched_mask_iou_mean
    - gt_normalized_mask_iou
    - gt_iou50_coverage
    - gt_iou75_coverage

  headlines_are_not_interchangeable: >-
    matched_mask_iou_mean describes mask quality where the model produced an
    overlapping same-class instance; gt_normalized_mask_iou divides the same IoU
    sum by every canonical instance, so misses lower it. Neither is a COCO AP
    and neither may be quoted as "the project's IoU" without saying which.

  combined_score: false

# --- the confusion matrix ------------------------------------------------------------------
#
# No canonical confusion-matrix protocol existed before this phase. One is
# frozen here, based only on the framework semantics already in force during
# validation, read from the installed ultralytics 8.4.138 source. No holdout
# data was consulted while deciding it.

confusion_matrix:
  protocol: FRAMEWORK_DETECTION_CONFUSION_MATRIX
  frozen_in_phase: 11A
  prior_canonical_protocol_existed: false
  basis: EXISTING_VALIDATION_CONVENTION_READ_FROM_INSTALLED_SOURCE
  implementation: ultralytics.utils.metrics.ConfusionMatrix
  implementation_version: ultralytics==8.4.138
  task: detect

  # Both read from the installed source rather than assumed.
  # `DetectionValidator.confusion_matrix_conf = 0.25 if conf is None else conf`,
  # and `process_batch` is called without `iou_thres`, so its signature default
  # applies. These are the exact values that produced every committed validation
  # confusion matrix in this repository.
  conf: 0.25
  conf_source: DETECTION_VALIDATOR_CONFUSION_MATRIX_CONF_DEFAULT
  iou_threshold: 0.45
  iou_threshold_source: CONFUSION_MATRIX_PROCESS_BATCH_SIGNATURE_DEFAULT

  # Read from the source: `box_iou` is computed over all ground truth against
  # all detections regardless of class, and the class pair is then recorded in
  # the matrix cell. A matched pair whose classes disagree lands off-diagonal.
  matching: CLASS_AGNOSTIC_IOU_THEN_CLASS_PAIR_RECORDED
  assignment: GREEDY_DESCENDING_IOU_DEDUPLICATED_ON_BOTH_AXES
  one_to_one: true

  matrix_shape: NC_PLUS_ONE_SQUARED
  matrix_dimension: 6
  orientation: ROWS_ARE_PREDICTED_COLUMNS_ARE_GROUND_TRUTH
  background_row_index: 5
  background_column_index: 5
  background_handling: >-
    The final row and column are the unmatched bucket. matrix[predicted, 5] is a
    prediction with no matched ground truth (false positive); matrix[5, gt] is a
    ground truth with no matched prediction (false negative). A matched pair
    with disagreeing classes increments matrix[predicted, gt] and counts as both
    a false positive and a false negative, which is the framework's own
    documented behaviour and is not modified here.

  class_ordering: CANONICAL_CLASS_MAP_INDEX_ORDER
  class_order:
    - helmet_loose
    - helmet_on_head
    - person
    - vest_loose
    - vest_on_body

  normalised_variant_also_reported: true
  threshold_chosen_after_seeing_test: false
  segmenter_matrix_also_reported: true
  segmenter_matrix_note: >-
    The segmenter's confusion matrix uses the identical detection semantics over
    its predicted boxes, exactly as the framework does during segmentation
    validation. It is a detection-level matrix for both models, so the two are
    directly comparable; no mask-level confusion matrix is defined, because the
    framework defines none and inventing one here would be a new metric.

# --- object-level TP / FP / FN --------------------------------------------------------------
#
# Frozen separately from the confusion matrix, because the qualitative selection
# needs per-instance outcomes rather than a matrix cell, and because a CLASS-AWARE
# rule is the right one for "which objects did the model get wrong".

object_level_matching:
  class_aware: true
  iou_threshold: 0.50
  assignment: ONE_TO_ONE_PER_IMAGE_PER_CLASS
  assignment_algorithm: GREEDY_DESCENDING_CONFIDENCE_THEN_HIGHEST_IOU
  confidence_threshold: 0.25
  confidence_threshold_origin: PROJECT_FROZEN_OPERATIONAL_THRESHOLD_UNCHANGED

  definitions:
    true_positive: >-
      A prediction whose class equals the ground truth's class and whose IoU
      with an as-yet-unmatched ground truth of that class is at least 0.50.
    false_positive: >-
      A prediction above the confidence threshold that is not a true positive:
      no unmatched same-class ground truth reaches the IoU threshold with it.
    false_negative: >-
      A ground-truth instance with no true positive assigned to it.

  redefinition_after_seeing_test_permitted: false

  # For the segmentation qualitative work, a miss and a bad mask are different
  # failures and are not pooled. Every definition below is predeclared.
  segmentation_failure_taxonomy:
    DETECTION_MISS: >-
      No prediction of any class reaches box IoU 0.50 with the ground-truth
      instance. The object was not found at all.
    CLASSIFICATION_MISMATCH: >-
      A prediction reaches box IoU 0.50 with the ground-truth instance but
      carries a different class.
    LOCALIZATION_FAILURE: >-
      A same-class prediction exists and overlaps the ground truth, but its box
      IoU is below 0.50.
    MASK_QUALITY_FAILURE: >-
      A same-class prediction is matched at box IoU 0.50 or above, but its mask
      IoU against the canonical mask is below 0.50.
    categories_are_evaluated_in_the_order_listed: true
    first_matching_category_wins: true
    categories_partition_every_ground_truth_instance: false
    unclassified_label: WELL_HANDLED_INSTANCE

# --- deterministic qualitative selection -------------------------------------------------------
#
# The whole point: the examples that appear in the academic report are chosen by
# a rule frozen before anyone has seen a holdout image. Browsing first and
# choosing second is exactly what this prevents.

qualitative_selection:
  policy: DETERMINISTIC_RANKING_FROZEN_BEFORE_ANY_TEST_ACCESS
  manual_cherry_picking_permitted: false
  selection_occurs_before_any_human_views_a_test_image: true
  human_interpretation_permitted_after_selection: true
  images_inspected_to_design_this_rule: 0

  examples_per_category: 3

  categories:
    HIGHEST_CONFIDENCE_FALSE_POSITIVE:
      applies_to: [detector, segmenter]
      rank_by: prediction_confidence
      order: descending
    HIGHEST_CONFIDENCE_CLASSIFICATION_MISMATCH:
      applies_to: [detector, segmenter]
      rank_by: prediction_confidence
      order: descending
    LOWEST_IOU_MATCHED_INSTANCE:
      applies_to: [detector, segmenter]
      rank_by: matched_box_iou
      order: ascending
    LARGEST_MISSED_INSTANCE:
      applies_to: [detector, segmenter]
      rank_by: ground_truth_area_pixels
      order: descending
    SEGMENTATION_UNDER_COVERAGE:
      applies_to: [segmenter]
      rank_by: predicted_mask_area_over_canonical_mask_area
      order: ascending
    SEGMENTATION_OVER_COVERAGE:
      applies_to: [segmenter]
      rank_by: predicted_mask_area_over_canonical_mask_area
      order: descending

  # Every rank_by value is a float, so ties are possible and must resolve the
  # same way on any machine. The chain ends in an identifier, which is unique.
  tie_breaking:
    - the ranked quantity itself
    - canonical_annotation_id ascending
    - canonical_prediction_index ascending
    - source_image_id lexicographic ascending
  tie_breaking_is_total_order: true
  deterministic: true
  random_sampling_permitted: false
  seed_required: false

  same_image_may_occupy_multiple_categories: true
  same_instance_may_occupy_multiple_categories: false
  duplicate_instance_policy: >-
    One canonical instance appears in at most one category. Categories are
    resolved in the order listed above and an instance already selected by an
    earlier category is skipped by every later one, so the published set never
    presents the same failure twice under two names. An image may legitimately
    appear more than once, because one image can contain several distinct
    failures.

  # A category with fewer qualifying instances than the quota publishes what it
  # has and records the shortfall. It is never topped up from another category.
  underfilled_category_policy: REPORT_AVAILABLE_COUNT_AND_RECORD_SHORTFALL
  topping_up_from_another_category_permitted: false

# --- spatial analysis on the holdout -------------------------------------------------------
#
# Deliberately minimal. The holdout exists to estimate generalisation, not to
# host a second exploratory study, and every additional quantity measured on it
# is another degree of freedom in how the final result can be narrated.

spatial_analysis_on_test:
  repeat_full_phase_10b_exploration: false
  new_spatial_metrics_permitted: false
  association_analysis_repeated: false
  operational_proxy_repeated: false
  rationale: >-
    The assignment requires final generalisation metrics, not a repeat of the
    validation-only exploratory spatial study. Phase 10B's spatial and
    association findings are already published as validation findings and are
    not re-opened on the holdout. Repeating them would add degrees of freedom
    without adding a required deliverable.
  quantities_predeclared_for_test: []

# --- computational cost --------------------------------------------------------------------

computational_cost:
  rerun_on_test: false
  already_measured_in_phase: 10C
  measurement_label: CONTROLLED_LOCAL_HARDWARE_BENCHMARK
  rationale: >-
    Latency and inference memory are properties of the model, the runtime and
    the machine, not of which split the images came from. Phase 10C measured
    them under a frozen symmetric protocol and phase 11B must not re-benchmark.
  latency_benchmark_permitted_in_phase_11b: false

# --- prediction persistence -----------------------------------------------------------------

prediction_persistence:
  # Git-ignored runtime locations, deterministic paths, never committed.
  detector_raw: artifacts/final_test/D2/predictions/
  segmenter_raw: artifacts/final_test/S1/predictions/
  canonical_bbox_predictions: artifacts/final_test/canonical/bbox_predictions.json
  canonical_mask_predictions: artifacts/final_test/canonical/mask_predictions.json
  direct_iou_representation: artifacts/final_test/canonical/direct_iou_instances.json
  ledger: artifacts/final_test/one_shot_ledger.json

  committed: false
  bulk_tensors_committed: false
  test_imagery_committed: false

  committed_outputs:
    - aggregated metrics
    - small deterministic manifests
    - approved qualitative figures
    - fingerprints
    - the one-shot ledger summary

  # Persisted before any metric is computed, so that a later report rebuild can
  # regenerate every number without touching a model.
  persisted_before_metric_computation: true

# --- fingerprints ------------------------------------------------------------------------------

fingerprints:
  prediction:
    detector: detector_test_prediction_sha256
    segmenter: segmenter_test_prediction_sha256
    covers:
      - model identity and checkpoint digest
      - protocol fingerprint
      - test split reference fingerprint
      - inference settings
      - the full ordered set of predictions with class, score and geometry
    purpose: >-
      Proves that every reported final number came from one prediction set. A
      report whose prediction fingerprint does not match the ledger's is not a
      rebuild; it is a second run.

  result:
    detector: detector_test_result_sha256
    segmenter: segmenter_test_result_sha256
    direct_iou: direct_iou_test_result_sha256
    qualitative: qualitative_selection_sha256
    covers:
      - model identity
      - test split reference fingerprint
      - evaluator protocol
      - inference settings
      - metric outputs
      - the corresponding prediction fingerprint

  excludes:
    - timestamp
    - username
    - hostname
    - absolute filesystem path
    - machine-specific run directory

  deterministic_recomputation_required: true

  rebuild_policy:
    predictions_rerun_on_rebuild: false
    metrics_regenerated_from_persisted_predictions: true
    note: >-
      A report rebuild re-derives metrics from the persisted prediction
      artifacts and must reproduce every committed figure identically. It is
      never a route to a different number.

# --- the one-shot ledger --------------------------------------------------------------------

one_shot_ledger:
  artifact: artifacts/final_test/one_shot_ledger.json
  committed_summary: reports/final_test_evaluation.provenance.json
  append_only: true
  attempt_counter_resettable: false
  mutable_history: false

  states:
    - NOT_STARTED
    - AUTHORIZED
    - MODEL_IDENTITY_VERIFIED
    - TEST_LOADED
    - DETECTOR_PREDICTION_STARTED
    - DETECTOR_PREDICTION_COMPLETE
    - SEGMENTER_PREDICTION_STARTED
    - SEGMENTER_PREDICTION_COMPLETE
    - PREDICTIONS_PERSISTED
    - METRICS_COMPUTED
    - ARTIFACTS_WRITTEN
    - COMPLETE
    - FAILED_REQUIRES_HUMAN_REVIEW

  records:
    - test unlock time
    - the authorising environment and code opt-in state
    - model identity verification result for both checkpoints
    - protocol fingerprint verification result
    - prediction start and end for each model
    - prediction completion state
    - prediction fingerprints
    - metric generation state
    - artifact generation state
    - every failure and every recovery action
    - attempt number and its written justification

  rerun_policy:
    automatic_rerun_permitted: false
    human_authorization_required: true
    attempt_must_be_numbered: true
    justification_required: true
    second_run_may_be_presented_as_the_first: false

# --- failure states -------------------------------------------------------------------------
#
# Named in advance so that a failure is classified rather than improvised, and
# so that the difference between "the report failed to write" and "the model
# failed to run" is settled before either can happen.

failure_policy:
  states:
    TEST_EVALUATION_COMPLETE: >-
      Predictions produced, metrics computed, artifacts written, fingerprints
      verified. The one and only successful outcome.
    BLOCKED_MISSING_MODEL_ARTIFACT: >-
      A frozen checkpoint is absent. Never a reason to retrain: a re-run
      produces different bytes under the same experiment name, which is exactly
      the substitution the digest accessor exists to catch.
    MODEL_IDENTITY_MISMATCH: >-
      A checkpoint is present but its digest is not the frozen one. Stop.
    TEST_UNLOCK_AUTHORIZATION_MISSING: >-
      One or both gates absent. The runner refuses and changes nothing. It may
      never satisfy the gate itself.
    TEST_DATA_INTEGRITY_FAILURE: >-
      A holdout file or annotation document fails the predeclared technical
      validation, before any model runs. Reported with counts; never silently
      excluded.
    PREDICTION_EXECUTION_FAILED_BEFORE_RESULTS: >-
      Inference failed before a complete prediction set existed. Preserve all
      evidence, stop, require human review. No automatic restart, and a later
      authorised run is a numbered attempt, never presented as the original.
    EVALUATION_ARTIFACT_WRITE_FAILURE_AFTER_VALID_PREDICTIONS: >-
      A complete, fingerprinted prediction set exists and only report writing
      failed. DO NOT rerun inference. Rebuild the metrics and reports from the
      persisted predictions.
    PROTOCOL_VIOLATION: >-
      The runner detected a deviation from this file. Stop without writing.

  partial_prediction_policy:
    preserve_evidence: true
    stop: true
    require_human_review: true
    automatic_restart_permitted: false
    present_second_run_as_original_permitted: false

  silent_rerun_permitted: false

# --- validation-versus-test comparison -------------------------------------------------------

validation_versus_test:
  permitted: true
  label: DESCRIPTIVE_GENERALIZATION_COMPARISON
  permitted_content:
    - the already-existing validation metric
    - the corresponding test metric
    - their absolute difference
  metrics_must_already_exist: true
  new_metric_invented_for_the_comparison: false

  significance_test: false
  significance_test_note: >-
    No significance test is predeclared and none may be added afterwards. Each
    model was trained once and evaluated once per split, so run-to-run variance
    is UNKNOWN and a gap of any size is an observation rather than a result.

  prohibited:
    - retuning in response to the gap
    - creating a post-test model
    - retrospectively selecting the better configuration
    - explaining the gap as though an experiment had tested the explanation

# --- reporting -------------------------------------------------------------------------------

reports:
  detector: reports/final_test_detector.json
  segmenter: reports/final_test_segmenter.json
  direct_iou: reports/final_test_direct_iou.json
  human_readable: reports/final_test_evaluation.md
  provenance: reports/final_test_evaluation.provenance.json
  optional_tables:
    - reports/final_test_per_class.csv

  created_in_phase_11a: false
  placeholder_values_permitted: false

  required_sections:
    - holdout policy
    - one-shot execution status
    - final model identities
    - test population
    - detector canonical bbox results
    - detector per-class results
    - segmenter canonical mask results
    - segmenter per-class results
    - S1 canonical box results
    - D2 versus S1 localisation comparison
    - direct mask-IoU diagnostic
    - confusion matrix
    - deterministically selected qualitative FP/FN examples
    - final limitations
    - relationship to the validation conclusions
    - explicit no-test-driven-tuning statement

figures:
  permitted:
    - detector confusion matrix
    - detector normalised confusion matrix
    - segmenter confusion matrix
    - per-class AP summary
    - deterministically selected qualitative FP/FN examples
  test_imagery_source: DETERMINISTIC_QUALITATIVE_SELECTION_ONLY
  browsing_then_choosing_permitted: false
  exploratory_visual_mining_permitted: false

# --- the final comparison ---------------------------------------------------------------------

final_comparison:
  label: DESCRIPTIVE_ONLY
  axes:
    - RECOGNITION_LOCALIZATION
    - SPATIAL_REPRESENTATION
    - COMPUTATIONAL_COST
  reports:
    - D2 canonical test box AP
    - S1 canonical test box AP
    - their delta
    - S1 canonical test mask AP
  computational_cost_source: PHASE_10C_VALIDATION_HARDWARE_BENCHMARK_NOT_RERUN

  winner_declared: false
  composite_score: false
  weighted_ranking: false
  aggregate_benefit_score: false
  model_selection_follows: false

# --- prohibited actions -------------------------------------------------------------------------

prohibited:
  - unlocking the holdout from any script
  - evaluating the holdout more than once
  - tuning any threshold on the holdout
  - sweeping any threshold on the holdout
  - selecting a model, architecture or checkpoint after seeing a holdout number
  - retraining or fine-tuning either frozen model
  - re-benchmarking latency or memory in phase 11B
  - introducing a new spatial metric on the holdout
  - repeating the phase 10B association analysis on the holdout
  - declaring a winner between the detector and the segmenter
  - computing a composite or weighted score
  - claiming compliance, violation or correct-wearing accuracy
  - inventing or relaxing a support threshold after seeing holdout support
  - cherry-picking qualitative examples by browsing
  - committing test identifiers, imagery, predictions or bulk tensors
  - presenting a second run as the original one-shot evaluation

test_policy: PROTECTED_NOT_ACCESSED
